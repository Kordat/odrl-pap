apiVersion: apps/v1
kind: Deployment
metadata:
  name: odrl-pap
  labels:
    app: odrl-pap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odrl-pap
  template:
    metadata:
      labels:
        app: odrl-pap
    spec:
      containers:
        - name: odrl-pap
          image: localhost:5000/odrl-pap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: odrl-pap
  labels:
    app: odrl-pap
spec:
  type: ClusterIP
  selector:
    app: odrl-pap
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
      name: http
